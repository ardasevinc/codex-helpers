name: Release CLI Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - bun-linux-x64
          - bun-linux-arm64
          - bun-darwin-x64
          - bun-darwin-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: bun install --frozen-lockfile

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compile CLI
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ steps.parse.outputs.package }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          SUFFIX="${TARGET#bun-}"
          case "${PACKAGE}" in
            codex-auth)
              bun build --compile --minify --target="${TARGET}" \
                "packages/${PACKAGE}/src/cli.ts" \
                --outfile "${PACKAGE}-${SUFFIX}"
              ;;
            codexhelp)
              case "${SUFFIX}" in
                linux-x64) GOOS=linux GOARCH=amd64 ;;
                linux-arm64) GOOS=linux GOARCH=arm64 ;;
                darwin-x64) GOOS=darwin GOARCH=amd64 ;;
                darwin-arm64) GOOS=darwin GOARCH=arm64 ;;
                *) echo "Unsupported Go target: ${SUFFIX}" >&2; exit 1 ;;
              esac
              export GOOS GOARCH CGO_ENABLED=0
              go build \
                -ldflags "-s -w -X github.com/ardasevinc/codex-helpers/internal/codexhelp/buildinfo.Version=${VERSION} -X github.com/ardasevinc/codex-helpers/internal/codexhelp/buildinfo.Commit=${GITHUB_SHA}" \
                -o "${PACKAGE}-${SUFFIX}" \
                ./cmd/codexhelp
              ;;
            *)
              echo "Unknown release package: ${PACKAGE}" >&2
              exit 1
              ;;
          esac

      - name: Upload release asset
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ steps.parse.outputs.tag }}
          PACKAGE: ${{ steps.parse.outputs.package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX="${TARGET#bun-}"
          gh release upload "${TAG}" "${PACKAGE}-${SUFFIX}" --clobber
